<!-- Early Dark Mode initialization script to prevent FOUC -->
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('shopaura_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) {}
  })();
</script>

/* ==========================================================================
   Background & Sparkle Animation Layer
   Base Background: #ffffff
   ========================================================================== */
body {
  background-color: #ffffff !important;
  color: #1e293b;
  min-height: 100vh;
  position: relative;
}

#sparkles-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
}

/* Ensure foreground sections and elements sit above background canvas */
header, section, footer, main, .container, .card, nav, aside {
  position: relative;
  z-index: 1;
}

/* Transparent sections so #929da7 & sparkles show through cleanly */
.bg,
.section-content,
.section-conten,
.section-intro,
.section-name,
.section-pagetop.bg {
  background-color: transparent !important;
}

/* Clean cards and panels with soft shadow against #929da7 */
.card,
.card-product-grid {
  background-color: #ffffff !important;
  border-radius: 12px !important;
  box-shadow: 0 4px 18px rgba(15, 10, 135, 0.08) !important;
}

/* ==========================================================================
   Dark Mode System & Navbar Option

/* Theme Toggle Button */
.theme-toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.75);
  border: 1.5px solid rgba(15, 10, 135, 0.25);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
  color: #0f0a87;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  outline: none !important;
  box-shadow: 0 2px 6px rgba(15, 10, 135, 0.08);
  user-select: none;
}

.theme-toggle-btn:hover {
  background: #0f0a87;
  color: #fdee00;
  border-color: #fc0c94;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(15, 10, 135, 0.25);

.theme-toggle-btn .theme-icon-moon {

  font-size: 14px;

.theme-toggle-btn:hover .theme-icon-moon {

<script type="text/javascript">
$(document).ready(function() {
  function updateThemeUI(isDark) {
    if (isDark) {
      $('html').addClass('dark-mode');
      $('body').addClass('dark-mode');
      $('.theme-text').text('Light');
      $('.theme-toggle-btn').attr('title', 'Switch to Light Mode');
    } else {
      $('html').removeClass('dark-mode');
      $('body').removeClass('dark-mode');
      $('.theme-text').text('Dark');
      $('.theme-toggle-btn').attr('title', 'Switch to Dark Mode');
    }
  }

  // Initial check from localStorage or OS preference
  try {
    var savedTheme = localStorage.getItem('shopaura_theme');
    var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (savedTheme) {
      updateThemeUI(savedTheme === 'dark');
    } else if (isDark) {
      updateThemeUI(true);
    }
  } catch(e) {}

  // Toggle button click listener
  $(document).on('click', '.theme-toggle-btn', function(e) {
    e.preventDefault();
    var currentlyDark = $('html').hasClass('dark-mode') || $('body').hasClass('dark-mode');
    var newDark = !currentlyDark;
    try {
      localStorage.setItem('shopaura_theme', newDark ? 'dark' : 'light');
    } catch(e) {}
    updateThemeUI(newDark);
  });
});
</script>

<body>
<!-- Animated Sparkling Background Canvas -->
<canvas id="sparkles-canvas"></canvas>

<!-- Sparkle Animation Script -->
<script>
(function() {
  var canvas = document.getElementById('sparkles-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var particles = [];
  var particleCount = 45;

  function getParticleColor() {
    var isDark = document.documentElement.classList.contains('dark-mode') || (document.body && document.body.classList.contains('dark-mode'));
    var darkColors = ['#fdee00', '#fc0c94', '#ffffff', '#00e5ff', '#ff8ad2'];
    var lightColors = ['#0f0a87', '#fc0c94', '#f59e0b', '#7c3aed', '#db2777', '#2563eb'];
    var set = isDark ? darkColors : lightColors;
    return set[Math.floor(Math.random() * set.length)];
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function() {
    setTimeout(resizeCanvas, 100);
  });

  function createParticle() {
    return {
      x: Math.random() * (canvas.width || window.innerWidth),
      y: Math.random() * (canvas.height || window.innerHeight),
      size: Math.random() * 4.5 + 2,
      speedY: Math.random() * 0.4 + 0.15,
      angle: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.03 + 0.015,
      color: getParticleColor(),
      isStar: Math.random() > 0.3
    };
  }

  for (var i = 0; i < particleCount; i++) {
    particles.push(createParticle());
  }

  function drawSparkleStar(x, y, size, opacity, color) {
    ctx.save();
    ctx.globalAlpha = Math.max(0.18, Math.min(1, opacity));
    ctx.fillStyle = color;
    ctx.shadowBlur = size * 2.5;
    ctx.shadowColor = color;
    
    // Draw 4-point sparkle star
    ctx.beginPath();
    ctx.moveTo(x, y - size * 1.8);
    ctx.quadraticCurveTo(x, y, x + size * 1.8, y);
    ctx.quadraticCurveTo(x, y, x, y + size * 1.8);
    ctx.quadraticCurveTo(x, y, x - size * 1.8, y);
    ctx.quadraticCurveTo(x, y, x, y - size * 1.8);
    ctx.closePath();
    ctx.fill();

    // Bright center core
    ctx.beginPath();
    ctx.arc(x, y, size * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 2;
    ctx.fill();

    ctx.restore();
  }

  function drawOrb(x, y, size, opacity, color) {
    ctx.save();
    ctx.globalAlpha = Math.max(0.18, Math.min(0.85, opacity));
    ctx.fillStyle = color;
    ctx.shadowBlur = size * 3;
    ctx.shadowColor = color;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.y -= p.speedY;
      p.x += Math.sin(p.angle) * 0.35;
      p.angle += p.pulseSpeed;

      var currentOpacity = 0.35 + Math.sin(p.angle) * 0.55;

      if (p.isStar) {
        drawSparkleStar(p.x, p.y, p.size, currentOpacity, p.color);
      } else {
        drawOrb(p.x, p.y, p.size, currentOpacity, p.color);
      }

      if (p.y < -30) {
        p.y = canvas.height + 20;
        p.x = Math.random() * canvas.width;
      }
      if (p.x < -30) p.x = canvas.width + 20;
      if (p.x > canvas.width + 30) p.x = -20;
    }

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
