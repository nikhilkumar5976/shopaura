<style>
/* Shopaura Brand Logo Styling */
.brand-logo-wrap {
  display: inline-flex;
  align-items: center;
  text-decoration: none !important;
  gap: 10px;
  padding: 2px 0;
  transition: all 0.25s ease;
}

.brand-logo-wrap:hover {
  text-decoration: none !important;
  transform: translateY(-1px);
}

.brand-logo-wrap .brand-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3167eb 0%, #7928ca 100%);
  color: #ffffff;
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(49, 103, 235, 0.3);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  flex-shrink: 0;
}

.brand-logo-wrap:hover .brand-icon {
  transform: rotate(-8deg) scale(1.08);
  box-shadow: 0 6px 18px rgba(49, 103, 235, 0.45);
}

.brand-logo-wrap .brand-text {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.5px;
  color: #1e293b;
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
  user-select: none;
}

.brand-logo-wrap .brand-aura {
  background: linear-gradient(135deg, #3167eb 0%, #8a2be2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 900;
  margin-left: 1px;
  transition: filter 0.3s ease;
}

.brand-logo-wrap:hover .brand-aura {
  filter: brightness(1.2);
}

.brand-logo-wrap .brand-dot {
  color: #3167eb;
  font-size: 26px;
  line-height: 0;
  font-weight: 900;
  margin-left: 1px;
}
</style>

</script>

</head>
