{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- ==============================================================================
     SHOPPING CART VIEW
     Displays all items in the user's active session cart, allows incrementing /
     decrementing quantities, item removal, and shows cost breakdown with tax.
============================================================================== -->
<section class="section-content padding-y bg">
    <div class="container">

        <!-- ============================ CART CONTENT ================================= -->
        <!-- Case 1: Empty Cart State -->

        <form action="{% url 'place_order' %}" method="POST">
            {% csrf_token %}
        <div class="row">

            <!-- Left Column: Table of Cart Items -->
            <aside class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h4 class="cart-title mb-4">Billing Address</h4>
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">First name </label>
                                <input type="text" name="first_name" class="form-control" placeholder="" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Last name </label>
                                <input type="text" name="last_name" class="form-control" placeholder="" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">Email </label>
                                <input type="email" name="email" class="form-control" placeholder="" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Phone Number </label>
                                <input type="text" name="phone" class="form-control" placeholder="" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">Address Line 1</label>
                                <input type="text" name="address_line_1" class="form-control" placeholder="" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Address Line 2</label>
                                <input type="text" name="address_line_2" class="form-control" placeholder="">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">City</label>
                                <input type="text" name="city" class="form-control" placeholder="" required>
                            </div>
                            <div class="col form-group">
                                <label for="">State</label>
                                <input type="text" name="state" class="form-control" placeholder="" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Country</label>
                                <input type="text" name="country" class="form-control" placeholder="" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="">Order Notes</label>
                            <textarea name="order_note" class="form-control" placeholder="Order Notes"></textarea>
                        </div>
                    </div>
                </div> <!-- card.// -->
            </aside> <!-- col.// -->

            <!-- Right Column: Order Summary & Checkout -->
            <aside class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-borderless table-shopping-cart">
                            <thead class="text-muted">
                                <tr class="small text-uppercase">
                                    <th scope="col">Product</th>
                                    <th scope="col" width="120">Quantity</th>
                                    <th scope="col" width="120">Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Iterate through each active line item in the cart -->
                                {% for cart_item in cart_items %}
                                <tr>
                                    <!-- Product Image, Name, and Selected Variations -->
                                    <td>
                                        <figure class="itemside align-items-center">
                                            <div class="aside">
                                                <img src="{{ cart_item.product.images.url }}" class="img-sm"
                                                    alt="{{ cart_item.product.product_name }}">
                                            </div>
                                            <figcaption class="info">
                                                <a href="{{ cart_item.product.get_url }}" class="title text-dark">{{ cart_item.product.product_name }}</a>
                                                <!-- Render any selected variations (e.g. Color: Red, Size: M) -->
                                                <p class="text-muted small">
                                                    {% if cart_item.variations.all %}
                                                        {% for item in cart_item.variations.all %}
                                                            {{ item.variation_category | capfirst }}: {{ item.variation_value | capfirst }}<br>
                                                        {% endfor %}
                                                    {% endif %}
                                                </p>
                                            </figcaption>
                                        </figure>
                                    </td>
                                    <td>
                                        <label for="">{{ cart_item.quantity }}</label>
                                    </td>
                                    <!-- Pricing: Subtotal for line item and unit price -->
                                    <td>
                                        <div class="price-wrap">
                                            <var class="price">${{ cart_item.sub_total }}</var>
                                            <small class="text-muted">${{ cart_item.product.price }} each</small>
                                        </div> <!-- price-wrap .// -->
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                        <!-- Order Summary Breakdown -->
                        <button type="submit" name="submit" class="btn btn-primary btn-block">Place Order</button>
                        <a href="{% url 'store' %}" class="btn btn-light btn-block">Continue Shopping</a>
                    </div> <!-- card-body.// -->
                </div> <!-- card.// -->

            </aside> <!-- col.// -->

        </div> <!-- row.// -->
        </form>

        <!-- ============================ CART CONTENT END ================================= -->

    </div> <!-- container .//  -->
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->
{% endblock %}
